<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>商户进件信息收集</title>
<style>
  :root {
    --green: #2e7d32; --green-light: #66bb6a; --green-bg: #e8f5e9;
    --red: #e53935; --gray: #757575;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; background: #f0f2f5; color: #333; padding-bottom: 80px; }
  .header { background: linear-gradient(135deg, var(--green), var(--green-light)); color: #fff; padding: 20px 16px; text-align: center; position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
  .header h1 { font-size: 18px; font-weight: 600; }
  .header p { font-size: 12px; opacity: 0.9; margin-top: 4px; }
  .container { max-width: 640px; margin: 16px auto; padding: 0 12px; }
  .section { background: #fff; border-radius: 12px; margin-bottom: 16px; overflow: hidden; box-shadow: 0 2px 12px rgba(0,0,0,0.06); }
  .section-title { background: var(--green); color: #fff; padding: 12px 16px; font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
  .section-title .num { background: #fff; color: var(--green); width: 22px; height: 22px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; }
  .section-body { padding: 12px 16px; }
  .field { margin-bottom: 14px; }
  .field:last-child { margin-bottom: 0; }
  .field label { display: block; font-size: 13px; color: #333; margin-bottom: 6px; font-weight: 500; }
  .field label .req { color: var(--red); margin-left: 2px; }
  .field label .hint { color: var(--gray); font-weight: 400; font-size: 12px; margin-left: 4px; }
  .field input[type="text"], .field input[type="tel"], .field input[type="email"], .field textarea, .field select { width: 100%; border: 1px solid #e0e0e0; border-radius: 8px; padding: 10px 12px; font-size: 14px; font-family: inherit; background: #fafafa; transition: border-color 0.2s, background 0.2s; -webkit-appearance: none; }
  .field input:focus, .field textarea:focus, .field select:focus { outline: none; border-color: var(--green); background: #fff; }
  .field textarea { resize: vertical; min-height: 60px; }
  .field-row { display: flex; gap: 10px; }
  .field-row .field { flex: 1; }
  .upload-area { border: 2px dashed #ccc; border-radius: 8px; padding: 16px; text-align: center; cursor: pointer; transition: border-color 0.2s, background 0.2s; background: #fafafa; position: relative; overflow: hidden; }
  .upload-area:active { background: #f0f0f0; }
  .upload-area.has-image { border-style: solid; border-color: #a5d6a7; background: var(--green-bg); padding: 8px; }
  .upload-area .placeholder { color: var(--gray); font-size: 13px; }
  .upload-area .placeholder .icon { font-size: 32px; display: block; margin-bottom: 4px; }
  .upload-area .placeholder .tip { font-size: 11px; color: #999; margin-top: 4px; }
  .upload-area img { max-width: 100%; max-height: 200px; border-radius: 6px; display: block; margin: 0 auto; }
  .upload-area .remove-btn { position: absolute; top: 6px; right: 6px; background: var(--red); color: #fff; border: none; width: 24px; height: 24px; border-radius: 50%; font-size: 14px; cursor: pointer; line-height: 1; display: none; }
  .upload-area.has-image .remove-btn { display: block; }
  .upload-area input[type="file"] { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }
  .channel-tabs { display: flex; gap: 0; margin-bottom: 14px; border-radius: 8px; overflow: hidden; border: 1px solid #a5d6a7; }
  .channel-tabs .tab { flex: 1; padding: 10px; text-align: center; font-size: 13px; cursor: pointer; background: #fff; color: var(--green); font-weight: 500; transition: all 0.2s; }
  .channel-tabs .tab.active { background: var(--green); color: #fff; }
  .section-hint { background: #fff8e1; border-left: 3px solid #ffca28; padding: 8px 12px; font-size: 12px; color: #795548; margin-bottom: 12px; border-radius: 0 6px 6px 0; }
  .submit-bar { position: fixed; bottom: 0; left: 0; right: 0; background: #fff; padding: 12px 16px; box-shadow: 0 -2px 12px rgba(0,0,0,0.08); z-index: 100; }
  .submit-bar .container { max-width: 640px; margin: 0 auto; padding: 0; }
  .btn-submit { width: 100%; background: linear-gradient(135deg, var(--green), var(--green-light)); color: #fff; border: none; border-radius: 10px; padding: 14px; font-size: 16px; font-weight: 600; cursor: pointer; transition: transform 0.1s, opacity 0.2s; }
  .btn-submit:active { transform: scale(0.98); }
  .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; }
  .toast { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.8); color: #fff; padding: 12px 24px; border-radius: 8px; font-size: 14px; z-index: 9999; opacity: 0; transition: opacity 0.2s; pointer-events: none; }
  .toast.show { opacity: 1; }
  .success-page { text-align: center; padding: 60px 20px; }
  .success-page .icon { font-size: 64px; color: var(--green); margin-bottom: 16px; }
  .success-page h2 { color: var(--green); margin-bottom: 8px; }
  .success-page p { color: var(--gray); margin-bottom: 24px; }
  .success-page button { background: var(--green); color: #fff; border: none; padding: 12px 32px; border-radius: 8px; font-size: 15px; cursor: pointer; }
  .loading { text-align: center; padding: 40px; color: var(--gray); }
</style>
</head>
<body>
<div class="header">
  <h1>商户进件信息收集</h1>
  <p>请如实填写以下信息，带 <span style="color:#ff5252">*</span> 为必填项</p>
</div>
<div class="container" id="mainContainer">
  <div class="loading">加载中...</div>
</div>

<div class="submit-bar" id="submitBar" style="display:none">
  <div class="container"><button type="button" class="btn-submit" id="submitBtn">提交信息</button></div>
</div>
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/app.js"></script>
</body>
</html>
