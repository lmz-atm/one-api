<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>商户信息管理后台</title>
<style>
  :root { --green: #2e7d32; --green-light: #66bb6a; --green-bg: #e8f5e9; --red: #e53935; --gray: #757575; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; background: #f5f5f5; color: #333; }
  .header { background: linear-gradient(135deg, var(--green), var(--green-light)); color: #fff; padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
  .header h1 { font-size: 18px; font-weight: 600; }
  .header .actions { display: flex; gap: 10px; }
  .header .actions button { background: rgba(255,255,255,0.2); color: #fff; border: none; padding: 8px 16px; border-radius: 6px; font-size: 13px; cursor: pointer; }
  .header .actions button:hover { background: rgba(255,255,255,0.3); }
  .container { max-width: 1400px; margin: 0 auto; padding: 20px; }
  .toolbar { background: #fff; border-radius: 8px; padding: 16px; margin-bottom: 16px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; box-shadow: 0 1px 4px rgba(0,0,0,0.06); }
  .toolbar input, .toolbar select { padding: 8px 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 13px; }
  .toolbar input { flex: 1; min-width: 200px; }
  .toolbar button { background: var(--green); color: #fff; border: none; padding: 8px 16px; border-radius: 6px; font-size: 13px; cursor: pointer; }
  .toolbar button:hover { background: #1b5e20; }
  .toolbar .count { color: var(--gray); font-size: 13px; }
  .table-wrap { background: #fff; border-radius: 8px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,0.06); }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  thead { background: var(--green); color: #fff; }
  th { padding: 12px; text-align: left; font-weight: 600; white-space: nowrap; }
  td { padding: 10px 12px; border-bottom: 1px solid #f0f0f0; white-space: nowrap; max-width: 200px; overflow: hidden; text-overflow: ellipsis; }
  tbody tr:hover { background: var(--green-bg); }
  .empty { text-align: center; padding: 60px 20px; color: var(--gray); }
  .status { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; }
  .status.wechat { background: #07c160; color: #fff; }
  .status.alipay { background: #1677ff; color: #fff; }
  .status.all { background: var(--green); color: #fff; }
  .btn-view { color: var(--green); cursor: pointer; margin-right: 8px; text-decoration: none; }
  .btn-del { color: var(--red); cursor: pointer; text-decoration: none; }
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: none; justify-content: center; align-items: center; z-index: 1000; }
  .modal-overlay.show { display: flex; }
  .modal { background: #fff; border-radius: 12px; width: 90%; max-width: 800px; max-height: 90vh; overflow-y: auto; }
  .modal-header { padding: 16px 20px; background: var(--green); color: #fff; border-radius: 12px 12px 0 0; display: flex; justify-content: space-between; align-items: center; }
  .modal-header h2 { font-size: 16px; }
  .modal-header .close { background: none; border: none; color: #fff; font-size: 24px; cursor: pointer; }
  .modal-body { padding: 20px; }
  .detail-section { margin-bottom: 20px; }
  .detail-section h3 { font-size: 14px; color: var(--green); margin-bottom: 10px; padding-bottom: 6px; border-bottom: 2px solid var(--green-bg); }
  .detail-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 10px; }
  .detail-item { padding: 6px 0; }
  .detail-item .label { font-size: 12px; color: var(--gray); margin-bottom: 2px; }
  .detail-item .value { font-size: 14px; color: #333; word-break: break-all; }
  .detail-item .value img { max-width: 100%; max-height: 150px; border-radius: 4px; margin-top: 4px; cursor: pointer; }
  .confirm-dialog { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: none; justify-content: center; align-items: center; z-index: 1001; }
  .confirm-dialog.show { display: flex; }
  .confirm-box { background: #fff; border-radius: 8px; padding: 24px; max-width: 320px; text-align: center; }
  .confirm-box h3 { margin-bottom: 12px; color: var(--red); }
  .confirm-box p { color: var(--gray); margin-bottom: 20px; font-size: 14px; }
  .confirm-box .buttons { display: flex; gap: 10px; }
  .confirm-box button { flex: 1; padding: 8px; border-radius: 6px; border: none; cursor: pointer; font-size: 14px; }
  .confirm-box .btn-cancel { background: #f0f0f0; color: #666; }
  .confirm-box .btn-confirm { background: var(--red); color: #fff; }
  @media (max-width: 768px) {
    .container { padding: 12px; }
    .toolbar { flex-direction: column; align-items: stretch; }
    .table-wrap { overflow-x: auto; }
  }
</style>
</head>
<body>
<div class="header">
  <h1>商户信息管理后台</h1>
  <div class="actions">
    <a href="/" target="_blank" style="color:#fff;text-decoration:none;font-size:13px">打开收集表单</a>
    <button onclick="exportCSV()">导出CSV</button>
    <button onclick="loadData()">刷新</button>
  </div>
</div>
<div class="container">
  <div class="toolbar">
    <input type="text" id="search" placeholder="搜索商户名称、法人、电话..." oninput="filterData()">
    <select id="filterChannel" onchange="filterData()">
      <option value="">全部渠道</option>
      <option value="微信">微信</option>
      <option value="支付宝">支付宝</option>
    </select>
    <span class="count" id="count"></span>
  </div>
  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>ID</th><th>商户名称</th><th>渠道</th><th>法人</th><th>电话</th><th>微信管理员</th><th>提交时间</th><th>操作</th>
        </tr>
      </thead>
      <tbody id="tableBody">
        <tr><td colspan="8" class="empty">加载中...</td></tr>
      </tbody>
    </table>
  </div>
</div>

<div class="modal-overlay" id="modal">
  <div class="modal">
    <div class="modal-header">
      <h2>商户详情</h2>
      <button class="close" onclick="closeModal()">×</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<div class="confirm-dialog" id="confirmDialog">
  <div class="confirm-box">
    <h3>确认删除</h3>
    <p id="confirmText">确定要删除这条记录吗？此操作不可恢复。</p>
    <div class="buttons">
      <button class="btn-cancel" onclick="closeConfirm()">取消</button>
      <button class="btn-confirm" onclick="doDelete()">删除</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = 'https://knykshhjspnfjmqjmqqx.supabase.co';
const ANON_KEY = 'sb_publishable_PAl2zLGZxfupo_ceCUWEWQ_94HJ0YYv';
const supabase = window.supabase.createClient(SUPABASE_URL, ANON_KEY);

let allData = [];
let deleteId = null;

async function loadData() {
  try {
    const { data, error } = await supabase
      .from('submissions')
      .select('*')
      .order('created_at', { ascending: false });

    if (error) throw error;
    allData = data || [];
    filterData();
  } catch (e) {
    document.getElementById('tableBody').innerHTML = '<tr><td colspan="8" class="empty">加载失败: ' + e.message + '</td></tr>';
  }
}

function filterData() {
  const keyword = document.getElementById('search').value.toLowerCase();
  const channel = document.getElementById('filterChannel').value;
  let filtered = allData.filter(r => {
    if (channel && r.submit_channel !== channel) return false;
    if (!keyword) return true;
    const searchFields = ['merchant_name', 'legal_name', 'phone_primary', 'phone_backup', 'admin_wechat_name'];
    return searchFields.some(f => (r[f] || '').toLowerCase().includes(keyword));
  });

  document.getElementById('count').textContent = `共 ${filtered.length} 条`;
  const tbody = document.getElementById('tableBody');

  if (filtered.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="empty">暂无商户提交记录</td></tr>';
    return;
  }

  tbody.innerHTML = filtered.map(r => {
    const chClass = r.submit_channel === '微信' ? 'wechat' : r.submit_channel === '支付宝' ? 'alipay' : 'all';
    const date = r.created_at ? new Date(r.created_at).toLocaleString('zh-CN') : '-';
    return `
      <tr>
        <td>${r.id}</td>
        <td>${r.merchant_name || '-'}</td>
        <td><span class="status ${chClass}">${r.submit_channel || '-'}</span></td>
        <td>${r.legal_name || '-'}</td>
        <td>${r.phone_primary || '-'}</td>
        <td>${r.admin_wechat_name || '-'} / ${r.admin_wechat_phone || '-'}</td>
        <td>${date}</td>
        <td>
          <a class="btn-view" onclick="viewDetail(${r.id})">查看</a>
          <a class="btn-del" onclick="askDelete(${r.id})">删除</a>
        </td>
      </tr>
    `;
  }).join('');
}

function viewDetail(id) {
  const r = allData.find(x => x.id === id);
  if (!r) return;

  const sections = [
    { title: '基本信息', items: [
      ['商户名称', r.merchant_name], ['提交渠道', r.submit_channel], ['提交时间', r.created_at ? new Date(r.created_at).toLocaleString('zh-CN') : '-']
    ]},
    { title: '微信管理员', items: [
      ['姓名', r.admin_wechat_name], ['电话', r.admin_wechat_phone], ['邮箱', r.admin_wechat_email]
    ]},
    { title: '支付宝联系人', items: [
      ['姓名', r.admin_alipay_name], ['电话', r.admin_alipay_phone], ['邮箱', r.admin_alipay_email]
    ]},
    { title: '银行信息', items: [
      ['对公账号/法人账号', r.bank_account], ['法人支付宝账号', r.legal_alipay_account], ['开户银行', r.bank_name], ['具体支行', r.bank_branch]
    ]},
    { title: '法人信息', items: [
      ['法人姓名', r.legal_name], ['法人微信号', r.legal_wechat_id]
    ]},
    { title: '小程序信息', items: [
      ['小程序头像', r.mini_avatar_image, true], ['小程序名称(微信)', r.mini_name_wechat], ['小程序名称(支付宝)', r.mini_name_alipay]
    ]},
    { title: '商家电话', items: [
      ['常用电话', r.phone_primary], ['备用电话', r.phone_backup]
    ]},
    { title: '资质图片', items: [
      ['营业执照', r.business_license_image, true], ['身份证正面', r.idcard_front_image, true], ['身份证反面', r.idcard_back_image, true], ['门头照', r.storefront_image, true], ['店内照', r.store_inside_image, true], ['特殊资质', r.special_qualification_image, true]
    ]},
    { title: '其他', items: [
      ['特殊资质说明', r.special_qualification_note], ['备注', r.remark]
    ]}
  ];

  const html = sections.map(s => `
    <div class="detail-section">
      <h3>${s.title}</h3>
      <div class="detail-grid">
        ${s.items.map(([label, val, isImg]) => `
          <div class="detail-item">
            <div class="label">${label}</div>
            <div class="value">${val ? (isImg && (val.startsWith('http') || val.startsWith('data:image/')) ? `<img src="${val}" onclick="window.open('${val}')"/>` : val) : '-'}</div>
          </div>
        `).join('')}
      </div>
    </div>
  `).join('');

  document.getElementById('modalBody').innerHTML = html;
  document.getElementById('modal').classList.add('show');
}

function closeModal() {
  document.getElementById('modal').classList.remove('show');
}

function askDelete(id) {
  deleteId = id;
  document.getElementById('confirmDialog').classList.add('show');
}

function closeConfirm() {
  deleteId = null;
  document.getElementById('confirmDialog').classList.remove('show');
}

async function doDelete() {
  if (!deleteId) return;
  try {
    const { error } = await supabase.from('submissions').delete().eq('id', deleteId);
    if (error) throw error;
    closeConfirm();
    loadData();
  } catch (e) {
    alert('删除失败: ' + e.message);
  }
}

function exportCSV() {
  if (allData.length === 0) return alert('暂无数据可导出');

  const headers = ['ID', '商户名称', '渠道', '微信管理员姓名', '微信管理员电话', '微信管理员邮箱', '支付宝联系人姓名', '支付宝联系人电话', '支付宝联系人邮箱', '对公账号', '法人支付宝账号', '开户银行', '具体支行', '法人姓名', '法人微信号', '微信小程序名称', '支付宝小程序名称', '常用电话', '备用电话', '特殊资质说明', '备注', '提交时间'];
  const keys = ['id', 'merchant_name', 'submit_channel', 'admin_wechat_name', 'admin_wechat_phone', 'admin_wechat_email', 'admin_alipay_name', 'admin_alipay_phone', 'admin_alipay_email', 'bank_account', 'legal_alipay_account', 'bank_name', 'bank_branch', 'legal_name', 'legal_wechat_id', 'mini_name_wechat', 'mini_name_alipay', 'phone_primary', 'phone_backup', 'special_qualification_note', 'remark', 'created_at'];

  const csv = [
    headers.join(','),
    ...allData.map(r => keys.map(k => {
      let v = r[k] || '';
      if (k === 'created_at' && v) v = new Date(v).toLocaleString('zh-CN');
      v = String(v).replace(/"/g, '""');
      return v.includes(',') || v.includes('\n') ? `"${v}"` : v;
    }).join(','))
  ].join('\n');

  const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8' });
  const link = document.createElement('a');
  link.href = URL.createObjectURL(blob);
  link.download = `商户信息_${new Date().toISOString().slice(0, 10)}.csv`;
  link.click();
}

loadData();
</script>
</body>
</html>
